services:
  # Backend API
  - type: web
    name: credence-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 5001
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: BLOCKCHAIN_RPC_URL
        sync: false
      - key: CONTRACT_ADDRESS
        sync: false
      - key: PRIVATE_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false # User will fill this with the provided frontend URL

  # Frontend Web App
  - type: web
    name: credence-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false # User will fill this with the provided backend URL + /api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
